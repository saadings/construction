        - text: 'What I am assuming. The app is a ledger for a Lahore house-building partnership. Nauman is the only user who matters and he uses it in two places: standing on a site with a phone, and at a desk doing a cheque run. The day sheet is the product — one sitting, one date, several trades — so I am designing that first and letting it set the system. What was actually wrong. Not the palette. The app has'
