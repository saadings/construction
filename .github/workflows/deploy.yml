name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================
  # Phase I — CI Checks (always run, in parallel)
  # ============================================
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Format check
        run: yarn format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Convex types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen
      - name: Lint
        run: yarn lint:check
      # The only step that reads the types. `vite build` strips them without
      # checking, and `convex codegen` only checks the backend as a side
      # effect of its default --typecheck mode, which is not a gate anyone
      # should be relying on. It runs after codegen because the backend cannot
      # be checked until convex/_generated exists.
      - name: Typecheck
        run: yarn typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Convex types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen
      - name: Build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          VITE_CONVEX_URL=$(bash scripts/convexUrl.sh)
          export VITE_CONVEX_URL
          echo "Building with VITE_CONVEX_URL: $VITE_CONVEX_URL"
          yarn build
      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/client
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Convex types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen
      - name: Run tests
        run: yarn test
      # The checks that catch a credential reaching git history, an identifier
      # from the template's organisation surviving, an unresolvable action in
      # this workflow, and the webhook status codes Clerk reads. They only
      # protect anything if something other than a person runs them.
      - name: Run scenario tests
        run: yarn test:scenario

  # ── Sync secrets to Convex (parallel with CI checks) ──
  # Runs alongside lint/build/test so it adds zero wall-clock time.
  # Must complete before deploy-backend to avoid the Convex
  # "Environment variables have changed during push" race condition.
  sync-secrets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Sync Secrets to Convex
        id: sync-convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          # Without pipefail the last command in a pipeline decides the status,
          # which is how a decode that fails halfway through still reports
          # success and puts a broken value on the deployment.
          set -euo pipefail

          set_convex_env() {
            local key=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "✗ $key has no value — refusing to leave it unset silently"
              return 1
            fi
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if echo "$value" | npx convex env set "$key"; then
                echo "✓ $key"
                return 0
              fi
              if [ $attempt -lt $max_attempts ]; then
                sleep $((2 ** attempt))
              fi
              attempt=$((attempt + 1))
            done
            echo "✗ Failed to set $key"
            return 1
          }

          # The publishable key carries the Clerk host as base64 with a trailing
          # '$', and Clerk ships it unpadded. Every decoder drops an incomplete
          # final group, so without restoring the padding the host loses its
          # last character — "…accounts.de" rather than "…accounts.dev". Convex
          # accepts that happily and then rejects every token signed by the real
          # instance, which reads as a permissions bug and is not one.
          raw=${CLERK_PUBLISHABLE_KEY#pk_*_}
          padded=$raw
          while [ $((${#padded} % 4)) -ne 0 ]; do
            padded="${padded}="
          done
          decoded=$(printf '%s' "$padded" | base64 -d)

          # Re-encoding has to land back on what we started with. A decoder that
          # dropped the last group produces something shorter, and this is the
          # only place that difference is ever visible.
          if [ "$(printf '%s' "$decoded" | base64 | tr -d '=\n')" != "$raw" ]; then
            echo "The Clerk host could not be read back out of the publishable key."
            exit 1
          fi

          CLERK_FAPI=${decoded%\$}

          set_convex_env "CLERK_FRONTEND_API_URL" "https://$CLERK_FAPI"
          set_convex_env "CLERK_WEBHOOK_SECRET" "$CLERK_WEBHOOK_SECRET"
          set_convex_env "CLERK_SECRET_KEY" "$CLERK_SECRET_KEY"
          set_convex_env "CLERK_PUBLISHABLE_KEY" "$CLERK_PUBLISHABLE_KEY"

  # ============================================
  # Phase II — Detect which components have changes
  #            (only after all CI checks pass)
  # ============================================
  detect-changes:
    needs: [format, lint, build, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # Full history so the previous commit is available to diff against.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Does with git what a third-party paths-filter action was doing, so the
      # pipeline depends only on actions/ and cloudflare/. Same path lists.
      - name: Detect which parts changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # First push to a branch reports an all-zero previous commit, and a
          # force-push can leave one that no longer exists. Either way there is
          # nothing to compare against, so deploy everything rather than guess.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against — treating everything as changed."
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          echo "$changed"

          changed_matches() {
            printf '%s\n' "$changed" | grep -qE "$1"
          }

          shared='^(package\.json|yarn\.lock|tsconfig\.json|tsconfig\.node\.json)$'

          backend=false
          if changed_matches '^convex/' || changed_matches "$shared"; then
            backend=true
          fi

          frontend=false
          if changed_matches '^frontend/' || changed_matches "$shared" ||
            changed_matches '^(tsconfig\.app\.json|components\.json)$'; then
            frontend=true
          fi

          echo "backend=$backend" >>"$GITHUB_OUTPUT"
          echo "frontend=$frontend" >>"$GITHUB_OUTPUT"
          echo "backend=$backend  frontend=$frontend"

  # ============================================
  # Phase III — Deploy Backend to Convex
  # ============================================
  deploy-backend:
    needs: [detect-changes, sync-secrets]
    if: github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Deploy Backend to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes

  # ============================================
  # Phase III — Deploy Frontend to Cloudflare Pages
  # ============================================
  deploy-frontend:
    needs: [detect-changes, build]
    if: github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      # The project name is written out rather than read from a repository
      # variable. This repository has none set, and an empty --project-name is
      # the sort of thing wrangler only complains about after the build has
      # already passed. It matches the default in scripts/setupCloudflareProject.ts.
      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=construction
