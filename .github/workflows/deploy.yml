name: CI & Deploy

on:
  push:
    branches:
      - main
  # Every pull request, whatever it targets. `branches:` here filters the base, so a stacked PR got no run at all and read as green.
  pull_request:

concurrency:
  # Runs against a branch queue rather than overlap: the needs edges only order jobs inside one run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Active LTS line, once, so no job silently runs a different runtime; see the commit for the setup-node v5 cache note.
  NODE_VERSION: '24.19.0'

jobs:
  # One runner for every check, because Actions bills per job rounded up to the minute: seven jobs of 31-51 seconds were seven billed minutes for under four minutes of work, and each of them paid the same 23 seconds of checkout, corepack and install. The step order below is the dependency graph those seven jobs expressed as `needs:`, and it is asserted as an order rather than left to be read.
  checks:
    # A pull request tests the merge commit, so the same checks on the push that follows cannot prevent anything -- they report that `main` is broken after it already is. Every merge here is rebuilt against current `main` and re-run before it is merged, which is the thing the push run would otherwise be a slower second copy of.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The scenario suite asks what this repository has ever committed; a depth-1 clone answers with the working tree.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # First, and before anything reaches the deployment: formatting needs no generated types, so putting it after codegen would delay the cheapest failure there is until after a write to production.
      - name: Format check
        run: yarn format:check

      # A pull request reads what a push writes. It fails here naming the variable rather than inside codegen, where a missing one reads as a broken auth config.
      - name: Check the deployment has what codegen reads
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          missing=
          for name in CLERK_FRONTEND_API_URL CLERK_WEBHOOK_SECRET CLERK_SECRET_KEY CLERK_PUBLISHABLE_KEY; do
            # Captured and never echoed: three of these four are secrets, and a job that prints one to prove it is there has published it to anyone who can read a log.
            if [ -z "$(npx convex env get "$name" 2>/dev/null || true)" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "✗ The deployment is missing:$missing"
            echo "  A push writes these. Until one has, codegen cannot validate auth.config.ts."
            exit 1
          fi

          echo "✓ The deployment has what codegen reads"

      # Codegen is not local: it validates auth.config.ts against the deployment, on a variable only the step above writes. Everything below reads what it writes, and it writes in place — the artifact this used to travel through existed only to cross a job boundary that no longer exists.
      - name: Generate Convex types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen

      # What `if-no-files-found: error` did for the artifact. Without it, codegen writing nothing fails three steps later on a missing module rather than here, where the message says what actually happened.
      - name: The generated types exist
        run: |
          set -euo pipefail
          if [ -z "$(ls -A convex/_generated 2>/dev/null)" ]; then
            echo "✗ codegen wrote nothing to convex/_generated"
            echo "  Everything below reads it, and would fail on a missing module instead of here."
            exit 1
          fi
          ls convex/_generated

      - name: Lint
        run: yarn lint:check

      # The only step that reads the generated types as types; behind lint it reported as a lint failure.
      - name: Typecheck
        run: yarn typecheck

      # The bundle imports `api` out of convex/_generated to call anything, so it cannot be built before those types exist.
      - name: Build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          VITE_CONVEX_URL=$(bash scripts/convexUrl.sh)
          export VITE_CONVEX_URL
          echo "Building with VITE_CONVEX_URL: $VITE_CONVEX_URL"
          yarn build

      # The gallery is a second HTML entry sitting in the same directory as the app's, and today it stays out of the app's build only because TanStack Start names its own rollup input. Nothing chose that for this reason, and if it ever changes the fixture screens ship to the same origin as the ledger — as a 200 that looks exactly like the app's own 200, which is the worst shape a defect can take.
      - name: The app's build is the app, and has no gallery in it
        run: |
          set -euo pipefail

          found=$(find frontend/dist -iname '*gallery*' -print -quit)
          if [ -n "$found" ]; then
            echo "✗ The app's build contains $found"
            echo "  The gallery draws invented figures. It must never be served from the ledger's own origin."
            exit 1
          fi

          # The control: a find over a directory that is not there reports the same clean nothing as a build with no gallery in it.
          test -f frontend/dist/client/index.html

          echo "✓ The app's build is the app"

      - name: Run tests
        run: yarn test

      # Credentials in history, inherited identifiers, unresolvable actions — none of it protects anything unless CI runs it.
      - name: Run scenario tests
        run: yarn test:scenario

      # Last, and deliberately: this is the only step that downloads a browser, so every cheaper failure above reports before anything pays for one.
      - name: Build the gallery
        run: yarn gallery:build

      # Chromium alone — three browsers is three downloads for one set of pictures. `--with-deps` is what makes it launch on a bare runner. Measured at 44s for 94.7 MiB; no cache until there is a run to cite, per 376e3ff.
      - name: Install the browser the pictures are taken with
        run: npx playwright install --with-deps chromium

      - name: Take a picture of every screen
        run: yarn shots

      # Three UI changes merged carrying "not observed at any width" and nothing else. This is what replaces that sentence.
      - name: Keep the pictures
        uses: actions/upload-artifact@v4
        with:
          name: every-screen
          path: shots/
          # Without it, a run that photographed nothing uploads an empty artifact and reports success.
          if-no-files-found: error

  # One runner for the whole of a push, for the same reason the checks are one: four jobs of well under a minute were four billed minutes, and three of them paid the same checkout and install. The two deploys were deliberately beside each other rather than in sequence, which accepted new UI going live before the backend caught up; in one job the backend goes first, which is the safer order and costs nothing.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the previous commit is available to diff against.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Does with git what a third-party paths-filter action did, so the pipeline depends only on actions/ and cloudflare/.
      - name: Detect which parts changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A first push reports an all-zero previous commit and a force-push can leave one that is gone; deploy everything rather than guess.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against — treating everything as changed."
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          echo "$changed"

          changed_matches() {
            printf '%s\n' "$changed" | grep -qE "$1"
          }

          # Named for the files it lists, not for what both sides happen to need: called `shared` it read as covering shared/, and so that directory went undeployed for a day.
          rootFiles='^(package\.json|yarn\.lock|tsconfig\.json|tsconfig\.node\.json)$'

          # shared/ is compiled into both sides rather than deployed on its own, so a rule about money changing there has to ship twice or it ships nowhere.
          backend=false
          if changed_matches '^convex/' || changed_matches '^shared/' || changed_matches "$rootFiles"; then
            backend=true
          fi

          # scripts/ counts as frontend because convexUrl.sh produces the address compiled into the bundle; `convex deploy` reads nothing there.
          frontend=false
          if changed_matches '^frontend/' || changed_matches '^shared/' || changed_matches '^scripts/' ||
            changed_matches "$rootFiles" || changed_matches '^(tsconfig\.app\.json|components\.json)$'; then
            frontend=true
          fi

          echo "backend=$backend" >>"$GITHUB_OUTPUT"
          echo "frontend=$frontend" >>"$GITHUB_OUTPUT"
          echo "backend=$backend  frontend=$frontend"
      # `npx convex env set` writes to whatever CONVEX_DEPLOY_KEY names, which is production, so a branch nobody has reviewed must not reach it.
      - name: Sync secrets to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail

          set_convex_env() {
            local key=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "✗ $key has no value — refusing to leave it unset silently"
              return 1
            fi
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if echo "$value" | npx convex env set "$key"; then
                echo "✓ $key"
                return 0
              fi
              if [ $attempt -lt $max_attempts ]; then
                sleep $((2 ** attempt))
              fi
              attempt=$((attempt + 1))
            done
            echo "✗ Failed to set $key"
            return 1
          }

          # Every value checked before any is written: this used to find a missing secret after writing the others.
          missing=
          for name in CONVEX_DEPLOY_KEY CLERK_PUBLISHABLE_KEY CLERK_WEBHOOK_SECRET CLERK_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "✗ No value for:$missing — refusing to write a partial set of variables"
            exit 1
          fi

          # In a script because the derivation needs testing: an empty key used to reach the deployment as `https://`.
          CLERK_FRONTEND_API_URL=$(bash scripts/clerkFrontendApiUrl.sh)

          set_convex_env "CLERK_FRONTEND_API_URL" "$CLERK_FRONTEND_API_URL"
          set_convex_env "CLERK_WEBHOOK_SECRET" "$CLERK_WEBHOOK_SECRET"
          set_convex_env "CLERK_SECRET_KEY" "$CLERK_SECRET_KEY"
          set_convex_env "CLERK_PUBLISHABLE_KEY" "$CLERK_PUBLISHABLE_KEY"

      # Codegen is not local: it validates auth.config.ts against the deployment, on a variable only the step above writes. The bundle imports `api` out of convex/_generated, so it cannot be built before these exist.
      - name: Generate Convex types
        if: steps.filter.outputs.frontend == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          VITE_CONVEX_URL=$(bash scripts/convexUrl.sh)
          export VITE_CONVEX_URL
          echo "Building with VITE_CONVEX_URL: $VITE_CONVEX_URL"
          yarn build

          # Deploying an empty directory is a successful deploy of nothing, which is the worst way for this to fail.
          if [ -z "$(ls -A frontend/dist/client 2>/dev/null)" ]; then
            echo "✗ the build produced nothing to deploy"
            exit 1
          fi

      # The backend first, which the two parallel jobs this replaced did not guarantee.
      - name: Deploy Backend to Convex
        if: steps.filter.outputs.backend == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes

      # Project name written out, not read from a repository variable: this repository has none, and empty fails only after the build passes.
      - name: Deploy Frontend to Cloudflare Pages
        if: steps.filter.outputs.frontend == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist/client --project-name=construction
