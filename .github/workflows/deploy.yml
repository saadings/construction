name: CI & Deploy

on:
  push:
    branches:
      - main
  # Every pull request, whatever it targets. `branches:` here filters the base, so a stacked PR got no run at all and read as green.
  pull_request:

concurrency:
  # Runs against a branch queue rather than overlap: the needs edges only order jobs inside one run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Active LTS line, once, so no job silently runs a different runtime; see the commit for the setup-node v5 cache note.
  NODE_VERSION: '24.19.0'

jobs:
  # Phase I. Waits for nothing, so a formatting mistake fails in under a minute rather than behind a write to the deployment.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Format check
        run: yarn format:check

  # The bundle imports `api` out of convex/_generated to call anything, so it cannot be built before those types exist.
  build:
    needs: [convex-codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download generated types
        uses: actions/download-artifact@v4
        with:
          name: convex-generated
          path: convex/_generated
      - name: Build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          VITE_CONVEX_URL=$(bash scripts/convexUrl.sh)
          export VITE_CONVEX_URL
          echo "Building with VITE_CONVEX_URL: $VITE_CONVEX_URL"
          yarn build
      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/client
          retention-days: 1

  # Runs codegen once for the three jobs that read it; needs sync-secrets because codegen validates auth.config.ts against the deployment.
  convex-codegen:
    needs: [sync-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Convex types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen
      - name: Upload generated types
        uses: actions/upload-artifact@v4
        with:
          name: convex-generated
          path: convex/_generated
          retention-days: 1
          # Without this, codegen writing nothing fails three jobs later on a missing module instead of here.
          if-no-files-found: error

  lint:
    needs: [convex-codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download generated types
        uses: actions/download-artifact@v4
        with:
          name: convex-generated
          path: convex/_generated
      - name: Lint
        run: yarn lint:check

  # The only job that reads the generated types as types; behind lint it reported as a lint failure.
  typecheck:
    needs: [convex-codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download generated types
        uses: actions/download-artifact@v4
        with:
          name: convex-generated
          path: convex/_generated
      - name: Typecheck
        run: yarn typecheck

  test:
    needs: [convex-codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The scenario suite asks what this repository has ever committed; a depth-1 clone answers with the working tree.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download generated types
        uses: actions/download-artifact@v4
        with:
          name: convex-generated
          path: convex/_generated
      - name: Run tests
        run: yarn test
      # Credentials in history, inherited identifiers, unresolvable actions — none of it protects anything unless CI runs it.
      - name: Run scenario tests
        run: yarn test:scenario

  # Runs on pull requests too, so PR CI writes to the production deployment — safe only because the values come from repository secrets.
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Sync Secrets to Convex
        id: sync-convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          # Without pipefail a decode that fails halfway still reports success and puts a broken value on the deployment.
          set -euo pipefail

          set_convex_env() {
            local key=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "✗ $key has no value — refusing to leave it unset silently"
              return 1
            fi
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if echo "$value" | npx convex env set "$key"; then
                echo "✓ $key"
                return 0
              fi
              if [ $attempt -lt $max_attempts ]; then
                sleep $((2 ** attempt))
              fi
              attempt=$((attempt + 1))
            done
            echo "✗ Failed to set $key"
            return 1
          }

          # Every value checked before any is written: this used to find a missing secret after writing the others.
          missing=
          for name in CONVEX_DEPLOY_KEY CLERK_PUBLISHABLE_KEY CLERK_WEBHOOK_SECRET CLERK_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "✗ No value for:$missing — refusing to write a partial set of variables"
            exit 1
          fi

          # In a script because the derivation needs testing: an empty key used to reach the deployment as `https://`.
          CLERK_FRONTEND_API_URL=$(bash scripts/clerkFrontendApiUrl.sh)

          set_convex_env "CLERK_FRONTEND_API_URL" "$CLERK_FRONTEND_API_URL"
          set_convex_env "CLERK_WEBHOOK_SECRET" "$CLERK_WEBHOOK_SECRET"
          set_convex_env "CLERK_SECRET_KEY" "$CLERK_SECRET_KEY"
          set_convex_env "CLERK_PUBLISHABLE_KEY" "$CLERK_PUBLISHABLE_KEY"

  # ── Phase II — which components changed, once every CI check has passed ──
  detect-changes:
    needs: [format, build, lint, typecheck, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # Full history so the previous commit is available to diff against.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Does with git what a third-party paths-filter action did, so the pipeline depends only on actions/ and cloudflare/.
      - name: Detect which parts changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A first push reports an all-zero previous commit and a force-push can leave one that is gone; deploy everything rather than guess.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against — treating everything as changed."
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          echo "$changed"

          changed_matches() {
            printf '%s\n' "$changed" | grep -qE "$1"
          }

          shared='^(package\.json|yarn\.lock|tsconfig\.json|tsconfig\.node\.json)$'

          backend=false
          if changed_matches '^convex/' || changed_matches "$shared"; then
            backend=true
          fi

          # scripts/ counts as frontend because convexUrl.sh produces the address compiled into the bundle; `convex deploy` reads nothing there.
          frontend=false
          if changed_matches '^frontend/' || changed_matches '^scripts/' || changed_matches "$shared" ||
            changed_matches '^(tsconfig\.app\.json|components\.json)$'; then
            frontend=true
          fi

          echo "backend=$backend" >>"$GITHUB_OUTPUT"
          echo "frontend=$frontend" >>"$GITHUB_OUTPUT"
          echo "backend=$backend  frontend=$frontend"

  # ── Phase III — deploy the backend to Convex ──
  deploy-backend:
    needs: [detect-changes, sync-secrets]
    if: github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # see NODE_VERSION above

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Deploy Backend to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes

  # Phase III, beside deploy-backend rather than behind it: by decision, this accepts new UI going live before the backend catches up.
  deploy-frontend:
    needs: [detect-changes, build]
    if: github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      # Project name written out, not read from a repository variable: this repository has none, and empty fails only after the build passes.
      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=construction
