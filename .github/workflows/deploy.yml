name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # Pushes to main queue rather than overlap: sync-secrets writing to the
  # production deployment while another run's `convex deploy` is in flight is
  # the race the needs-edge below only prevents inside a single run. Wrangler
  # can finish out of order too, leaving the older commit live with both runs
  # green.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Active LTS line. Written once here rather than repeated in every job,
  # because a pipeline where one job silently runs a different runtime from the
  # rest is a debugging problem nobody expects to have.
  NODE_VERSION: '24.19.0'

jobs:
  # ============================================
  # Phase I — CI Checks
  # ============================================

  # Nothing to wait for: prettier reads the tree and nothing else. Kept ahead of
  # every other job so a formatting mistake fails in well under a minute rather
  # than behind a write to the deployment.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Format check
        run: yarn format:check

  # The frontend bundle imports nothing out of convex/_generated — it reaches
  # the backend over the wire, by URL — so this does not wait for codegen. It is
  # the longest job in Phase I, and putting it behind the Convex round-trip
  # would add that round-trip to the critical path for no gain.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          VITE_CONVEX_URL=$(bash scripts/convexUrl.sh)
          export VITE_CONVEX_URL
          echo "Building with VITE_CONVEX_URL: $VITE_CONVEX_URL"
          yarn build
      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/client
          retention-days: 1

  # Generated once and handed to the three jobs that read it, rather than run
  # again inside each of them. convex/_generated/ is gitignored, so lint, test
  # and typecheck cannot start without it — but it is the same output every
  # time, and producing it three times meant three uploads to the deployment
  # per run.
  #
  # It waits for sync-secrets because `npx convex codegen` is not a local
  # operation: with a deploy key in scope it uploads the function definitions
  # and validates convex/auth.config.ts against the deployment's own
  # environment. That file reads CLERK_FRONTEND_API_URL, which sync-secrets is
  # the only thing that writes. The variable happens to be set on the
  # deployment today, so the edge looks removable — it is not. Drop it and the
  # next variable added to the auth config fails every pull request until
  # something merges to main, which is exactly how this pipeline was broken
  # before.
  convex-codegen:
    needs: [sync-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Convex types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen
      - name: Upload generated types
        uses: actions/upload-artifact@v4
        with:
          name: convex-generated
          path: convex/_generated
          retention-days: 1
          # codegen writing nothing would otherwise hand the three jobs below an
          # empty directory, and each would fail on a missing module rather than
          # here, where the cause is legible.
          if-no-files-found: error

  lint:
    needs: [convex-codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download generated types
        uses: actions/download-artifact@v4
        with:
          name: convex-generated
          path: convex/_generated
      - name: Lint
        run: yarn lint:check

  # Its own job rather than a step of lint. It is the only thing in the pipeline
  # that reads the generated types as types — `vite build` strips them without
  # checking, and `convex codegen` only checks the backend as a side effect of
  # its default --typecheck mode, which is not a gate anyone should rely on.
  # Behind lint it reported as a lint failure; here it reports as itself.
  typecheck:
    needs: [convex-codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download generated types
        uses: actions/download-artifact@v4
        with:
          name: convex-generated
          path: convex/_generated
      - name: Typecheck
        run: yarn typecheck

  test:
    needs: [convex-codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The scenario suite asks what this repository has ever committed.
          # A depth-1 clone answers that question with the working tree.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download generated types
        uses: actions/download-artifact@v4
        with:
          name: convex-generated
          path: convex/_generated
      - name: Run tests
        run: yarn test
      # The checks that catch a credential reaching git history, an identifier
      # from the template's organisation surviving, an unresolvable action in
      # this workflow, and the webhook status codes Clerk reads. They only
      # protect anything if something other than a person runs them.
      - name: Run scenario tests
        run: yarn test:scenario

  # ── Sync secrets to Convex ──
  # Ahead of deploy-backend to avoid the Convex "Environment variables have
  # changed during push" race condition, and ahead of convex-codegen because
  # codegen validates the auth config against the variables this job writes.
  #
  # It runs for pull requests as well as pushes, which means pull request CI
  # writes to the production deployment. Deliberate, and only safe because the
  # values come from repository secrets — a pull request run writes the same
  # bytes a push would — there are no forks to hand `secrets.*` to anyone
  # untrusted, and the derivation below refuses a malformed key before anything
  # is written. The better long-term shape is a Convex preview deploy key for
  # `pull_request`, which is a larger change than this one.
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Sync Secrets to Convex
        id: sync-convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          # Without pipefail the last command in a pipeline decides the status,
          # which is how a decode that fails halfway through still reports
          # success and puts a broken value on the deployment.
          set -euo pipefail

          set_convex_env() {
            local key=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "✗ $key has no value — refusing to leave it unset silently"
              return 1
            fi
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if echo "$value" | npx convex env set "$key"; then
                echo "✓ $key"
                return 0
              fi
              if [ $attempt -lt $max_attempts ]; then
                sleep $((2 ** attempt))
              fi
              attempt=$((attempt + 1))
            done
            echo "✗ Failed to set $key"
            return 1
          }

          # Every value is checked before any of them is written. The step used
          # to discover a missing secret partway down the list, after it had
          # already put other values on the production deployment.
          missing=
          for name in CONVEX_DEPLOY_KEY CLERK_PUBLISHABLE_KEY CLERK_WEBHOOK_SECRET CLERK_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "✗ No value for:$missing — refusing to write a partial set of variables"
            exit 1
          fi

          # In a script rather than inline because the derivation needs testing:
          # the guard in set_convex_env cannot catch a bad value while the
          # caller puts a prefix in front of it, and an empty key used to reach
          # the deployment as the eight characters `https://`.
          CLERK_FRONTEND_API_URL=$(bash scripts/clerkFrontendApiUrl.sh)

          set_convex_env "CLERK_FRONTEND_API_URL" "$CLERK_FRONTEND_API_URL"
          set_convex_env "CLERK_WEBHOOK_SECRET" "$CLERK_WEBHOOK_SECRET"
          set_convex_env "CLERK_SECRET_KEY" "$CLERK_SECRET_KEY"
          set_convex_env "CLERK_PUBLISHABLE_KEY" "$CLERK_PUBLISHABLE_KEY"

  # ============================================
  # Phase II — Detect which components have changes
  #            (only after all CI checks pass)
  # ============================================
  detect-changes:
    needs: [format, build, lint, typecheck, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # Full history so the previous commit is available to diff against.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Does with git what a third-party paths-filter action was doing, so the
      # pipeline depends only on actions/ and cloudflare/. Same path lists.
      - name: Detect which parts changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # First push to a branch reports an all-zero previous commit, and a
          # force-push can leave one that no longer exists. Either way there is
          # nothing to compare against, so deploy everything rather than guess.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against — treating everything as changed."
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          echo "$changed"

          changed_matches() {
            printf '%s\n' "$changed" | grep -qE "$1"
          }

          shared='^(package\.json|yarn\.lock|tsconfig\.json|tsconfig\.node\.json)$'

          backend=false
          if changed_matches '^convex/' || changed_matches "$shared"; then
            backend=true
          fi

          # scripts/ counts as frontend because scripts/convexUrl.sh is the sole
          # producer of the address compiled into the bundle, and nothing
          # downstream ever looks at that address again. A commit fixing it used
          # to report frontend=false, skip the deploy, and let the corrected
          # artifact expire — every job green, production still on the old
          # address. It is deliberately not counted as backend: `convex deploy`
          # reads nothing from there.
          frontend=false
          if changed_matches '^frontend/' || changed_matches '^scripts/' || changed_matches "$shared" ||
            changed_matches '^(tsconfig\.app\.json|components\.json)$'; then
            frontend=true
          fi

          echo "backend=$backend" >>"$GITHUB_OUTPUT"
          echo "frontend=$frontend" >>"$GITHUB_OUTPUT"
          echo "backend=$backend  frontend=$frontend"

  # ============================================
  # Phase III — Deploy Backend to Convex
  # ============================================
  deploy-backend:
    needs: [detect-changes, sync-secrets]
    if: github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Deploy Backend to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes

  # ============================================
  # Phase III — Deploy Frontend to Cloudflare Pages
  # ============================================
  # Runs beside deploy-backend rather than behind it, by decision: the two
  # deploys are independent and the frontend reaches the backend by URL, so
  # neither build depends on the other's output. The exposure this accepts is a
  # push that adds a Convex function together with the UI calling it — the
  # frontend is the shorter job and will win, so that UI is live against a
  # backend that has not caught up yet, and a failed backend deploy leaves it
  # live against the old one.
  deploy-frontend:
    needs: [detect-changes, build]
    if: github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      # The project name is written out rather than read from a repository
      # variable. This repository has none set, and an empty --project-name is
      # the sort of thing wrangler only complains about after the build has
      # already passed. It matches the default in scripts/setupCloudflareProject.ts.
      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=construction
