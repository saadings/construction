name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================
  # Phase I — CI Checks (always run, in parallel)
  # ============================================
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Format check
        run: yarn format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Convex types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen
      - name: Lint
        run: yarn lint:check
      # Nothing else in the pipeline reads the types: vite build strips them
      # without checking them, and convex codegen is told to skip the check.
      - name: Typecheck
        run: yarn typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Convex types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen
      - name: Build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NODE_ENV: ${{ vars.ENVIRONMENT }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
        run: |
          DEPLOY_NAME=$(echo "$CONVEX_DEPLOY_KEY" | sed 's/.*:\(.*\)|.*/\1/')
          export VITE_CONVEX_URL="https://${DEPLOY_NAME}.convex.cloud"
          echo "Building with VITE_CONVEX_URL: $VITE_CONVEX_URL (NODE_ENV=$NODE_ENV)"
          yarn build
      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/client
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Convex types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen
      - name: Run tests
        run: yarn test
      # The checks that catch a credential reaching git history, an identifier
      # from the template's organisation surviving, an unresolvable action in
      # this workflow, and the webhook status codes Clerk reads. They only
      # protect anything if something other than a person runs them.
      - name: Run scenario tests
        run: yarn test:scenario

  # ── Sync secrets to Convex (parallel with CI checks) ──
  # Runs alongside lint/build/test so it adds zero wall-clock time.
  # Must complete before deploy-backend to avoid the Convex
  # "Environment variables have changed during push" race condition.
  sync-secrets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Sync Secrets to Convex
        id: sync-convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set_convex_env() {
            local key=$1
            local value=$2
            if [ -n "$value" ]; then
              local max_attempts=3
              local attempt=1
              while [ $attempt -le $max_attempts ]; do
                if echo "$value" | npx convex env set "$key"; then
                  echo "✓ $key"
                  return 0
                fi
                if [ $attempt -lt $max_attempts ]; then
                  sleep $((2 ** attempt))
                fi
                attempt=$((attempt + 1))
              done
              echo "✗ Failed to set $key"
              return 1
            fi
          }

          CLERK_FAPI=$(echo "$CLERK_PUBLISHABLE_KEY" | sed 's/pk_[a-z]*_//' | base64 -d | tr -d '$')

          set_convex_env "ENVIRONMENT" "${{ vars.ENVIRONMENT }}"
          set_convex_env "CLERK_FRONTEND_API_URL" "https://$CLERK_FAPI"
          set_convex_env "CLERK_WEBHOOK_SECRET" "$CLERK_WEBHOOK_SECRET"
          set_convex_env "CLERK_SECRET_KEY" "$CLERK_SECRET_KEY"
          set_convex_env "CLERK_PUBLISHABLE_KEY" "$CLERK_PUBLISHABLE_KEY"

  # ============================================
  # Phase II — Detect which components have changes
  #            (only after all CI checks pass)
  # ============================================
  detect-changes:
    needs: [format, lint, build, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # Full history so the previous commit is available to diff against.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Does with git what a third-party paths-filter action was doing, so the
      # pipeline depends only on actions/ and cloudflare/. Same path lists.
      - name: Detect which parts changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # First push to a branch reports an all-zero previous commit, and a
          # force-push can leave one that no longer exists. Either way there is
          # nothing to compare against, so deploy everything rather than guess.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against — treating everything as changed."
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          echo "$changed"

          changed_matches() {
            printf '%s\n' "$changed" | grep -qE "$1"
          }

          shared='^(package\.json|yarn\.lock|tsconfig\.json|tsconfig\.node\.json)$'

          backend=false
          if changed_matches '^convex/' || changed_matches "$shared"; then
            backend=true
          fi

          frontend=false
          if changed_matches '^frontend/' || changed_matches "$shared" ||
            changed_matches '^(tsconfig\.app\.json|components\.json)$'; then
            frontend=true
          fi

          echo "backend=$backend" >>"$GITHUB_OUTPUT"
          echo "frontend=$frontend" >>"$GITHUB_OUTPUT"
          echo "backend=$backend  frontend=$frontend"

  # ============================================
  # Phase III — Deploy Backend to Convex
  # ============================================
  deploy-backend:
    needs: [detect-changes, sync-secrets]
    if: github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Deploy Backend to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes

  # ============================================
  # Phase III — Deploy Frontend to Cloudflare Pages
  # ============================================
  deploy-frontend:
    needs: [detect-changes, build]
    if: github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
